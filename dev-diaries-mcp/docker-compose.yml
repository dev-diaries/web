version: '3.8'

services:
  dev-diaries-mcp:
    build: .
    container_name: dev-diaries-mcp
    volumes:
      - ./data:/app/data
      - /path/to/your/dev-diaries:/data:ro  # Mount your dev-diaries repo as read-only
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # Uncomment if you want to expose a web interface in the future
    # ports:
    #   - "3000:3000"
