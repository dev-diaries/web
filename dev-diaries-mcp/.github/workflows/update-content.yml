name: Update Content

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        default: false
        type: boolean

jobs:
  update-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Download latest content
        run: |
          # Download content from the main Dev Diaries repository
          npm run download-content github khaliqgant/dev-diaries main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true' || github.event.inputs.force_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "chore: update content from Dev Diaries repository [skip ci]"
          git push
          
      - name: Create PR for content updates
        if: steps.check-changes.outputs.has_changes == 'true' || github.event.inputs.force_update == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update content from Dev Diaries repository"
          title: "🔄 Update content from Dev Diaries repository"
          body: |
            ## Content Update
            
            This PR updates the content database with the latest posts from the Dev Diaries repository.
            
            ### Changes
            - Updated content index
            - Latest blog posts and social media tips
            - Improved search functionality
            
            ### Testing
            - [ ] Content indexing works correctly
            - [ ] Search functionality is working
            - [ ] All tests pass
            
            **Auto-generated by GitHub Actions**
          branch: update-content
          delete-branch: true
