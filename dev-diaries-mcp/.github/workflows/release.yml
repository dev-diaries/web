name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test
        continue-on-error: true
        
      - name: Build project
        run: npm run build
        
      - name: Check if version exists
        id: check-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Check if version already exists on NPM
          if npm view @dev-diaries/mcp@$VERSION version > /dev/null 2>&1; then
            echo "Version $VERSION already exists on NPM"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION does not exist on NPM"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Update package.json version
        if: steps.check-version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.check-version.outputs.version }}"
          npm version $VERSION --no-git-tag-version
          
      - name: Publish to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Create GitHub Release
        if: steps.check-version.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.check-version.outputs.version }}
          release_name: Release v${{ steps.check-version.outputs.version }}
          body: |
            ## What's New
            
            This release includes:
            - Updated Dev Diaries content
            - Bug fixes and improvements
            - Enhanced search functionality
            
            ## Installation
            
            ```bash
            npm install -g @dev-diaries/mcp
            ```
            
            ## Usage
            
            Add to your Cursor configuration:
            ```json
            {
              "mcpServers": {
                "dev-diaries": {
                  "command": "npx",
                  "args": ["@dev-diaries/mcp"]
                }
              }
            }
            ```
          draft: false
          prerelease: false
          
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.check-version.outputs.version }}';
            const exists = '${{ steps.check-version.outputs.exists }}';
            
            if (exists === 'false') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Package Published!**
                
                Version \`${version}\` has been successfully published to NPM!
                
                **Installation:**
                \`\`\`bash
                npm install -g @dev-diaries/mcp@${version}
                \`\`\`
                
                **NPM Package:** https://www.npmjs.com/package/@dev-diaries/mcp`
              });
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ **Version Already Exists**
                
                Version \`${version}\` already exists on NPM. Please update the version number.`
              });
            }
